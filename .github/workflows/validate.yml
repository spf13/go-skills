name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test the checker
        run: go test ./...
      - name: Run hermetic catalog check
        run: go run ./cmd/check

  skill-code:
    name: skill code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Unit-test the check scripts
        run: python3 -m unittest discover -s .github/scripts
      - name: Parse every Go fence and check std version claims
        run: python3 .github/scripts/check_skill_code.py
      - name: Run the behavioral claim tests
        working-directory: .github/claims
        run: go test ./...

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README.md and CONTRIBUTING.md
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept "200..=299" README.md CONTRIBUTING.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
